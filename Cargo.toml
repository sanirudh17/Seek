[workspace]
resolver = "2"
members = ["app", "crates/engine", "crates/seek-cli", "crates/seek-helper"]
exclude = ["vendor/gpui-component", "vendor/gpui-windows"]

[workspace.package]
edition = "2024"
version = "1.0.2"
license = "MIT"

[workspace.dependencies]
gpui = { version = "=0.2.2", git = "https://github.com/zed-industries/zed", rev = "279fe070bb389b79652e52065b2f001edcc0b11b", default-features = false, features = ["windows-manifest"] }
gpui-component = { path = "vendor/gpui-component/crates/component" }
anyhow = "1"

[patch.crates-io]
gpui = { version = "=0.2.2", git = "https://github.com/zed-industries/zed", rev = "279fe070bb389b79652e52065b2f001edcc0b11b" }

[patch."https://github.com/zed-industries/zed"]
gpui_windows = { path = "vendor/gpui-windows" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-small]
inherits = "release"
opt-level = "s"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2
