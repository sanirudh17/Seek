[package]
name = "seek"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
benchmarks = ["dep:gpui_windows", "gpui_windows/seek-bench"]

[dependencies]
gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets = { package = "gpui-kit-assets", path = "../vendor/gpui-component/crates/assets" }
anyhow.workspace = true
seek-engine = { path = "../crates/engine" }
async-channel = "2.5"
chrono = "0.4.44"
gpui-base = { path = "../vendor/gpui-component/crates/base", features = ["seek-static-caret"] }
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security", "Win32_Graphics_Dwm", "Win32_UI_HiDpi"] }

gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "279fe070bb389b79652e52065b2f001edcc0b11b" }
gpui_windows = { path = "../vendor/gpui-windows", optional = true, default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
resvg = { version = "=0.46.0", default-features = false }
raw-window-handle = "0.6"
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_Storage_IndexServer", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell_Common", "Data_Pdf", "Storage_Streams", "Foundation", "Win32_System_WinRT"] }

zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
quick-xml = "=0.38.4"

calamine = { version = "=0.36.1", default-features = false }
sha2 = "=0.10.9"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
embed-resource = "=3.0.12"
