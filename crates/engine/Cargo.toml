[package]
name = "seek-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Windows port of the pinned fsearch-crossplatform filename engine"

[dependencies]
rayon = "1.12"
memchr = "2.8"
memmap2 = "0.9"
regex = "1.12"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Services", "Win32_Security", "Win32_Security_Authorization", "Win32_Globalization", "Win32_UI_Shell", "Win32_System_Com"] }

[dev-dependencies]
tempfile = "3"
