[package]
name = "seek-helper"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
embed-resource = "=3.0.12"

[dependencies]
seek-engine = { path = "../engine" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Services", "Win32_System_SystemServices", "Win32_System_Com", "Win32_Security", "Win32_Security_Authorization", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"
windows-sys = { version = "0.61", features = ["Win32_System_Memory"] }
